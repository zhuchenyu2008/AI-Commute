name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - android-native-client
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK and capture log
        id: build
        working-directory: android
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug 2>&1 | tee ../android-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload APK artifact
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: AI-Commute-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish build result back to current branch
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p artifacts
          if [ -f android-build.log ]; then
            cp android-build.log artifacts/android-build.log
          fi
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/AI-Commute-Android.apk
            echo success > artifacts/android-build-status.txt
          else
            echo failed > artifacts/android-build-status.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts
          git commit -m "chore: publish Android build result [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fail workflow when Gradle failed
        if: steps.build.outputs.status != '0'
        run: exit 1
